<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modownloader Forum</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111111;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    width: 95%;
    max-width: 1100px;
    height: 92vh;
    background: #1a1a1a;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #2f2f2f;
}

.header {
    padding: 18px;
    background: #181818;
    border-bottom: 1px solid #2a2a2a;
    font-size: 24px;
    font-weight: bold;
}

.login-screen {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 400px;
    background: #202020;
    padding: 30px;
    border-radius: 18px;
    border: 1px solid #333333;
}

.login-title {
    font-size: 28px;
    margin-bottom: 20px;
    text-align: center;
}

.input {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    background: #2b2b2b;
    border: 1px solid #3d3d3d;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    outline: none;
}

.button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #3a7dff;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.button:hover {
    background: #5a95ff;
}

.chat-screen {
    display: none;
    flex-direction: column;
    height: 100%;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #151515;
}

.message-box {
    background: #242424;
    border-radius: 16px;
    padding: 14px;
    border: 1px solid #363636;
    animation: popup 0.15s ease;
}

@keyframes popup {
    from {
        transform: scale(0.95);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.message-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.username {
    font-weight: bold;
    color: #5aa2ff;
}

.type {
    background: #323232;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
}

.message-text {
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
}

.chat-bottom {
    padding: 15px;
    border-top: 1px solid #2b2b2b;
    background: #181818;
    display: flex;
    gap: 10px;
}

.message-input {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #3a3a3a;
    background: #242424;
    color: white;
    outline: none;
    font-size: 15px;
}

.send-button {
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    background: #3a7dff;
    color: white;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
}

.send-button:hover {
    background: #5a95ff;
}

.notice {
    padding: 10px 20px;
    background: #262626;
    color: #bcbcbc;
    font-size: 13px;
    border-bottom: 1px solid #333333;
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        Modownloader Forum
    </div>

    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-title">Sign In</div>

            <input
                type="text"
                id="usernameInput"
                class="input"
                placeholder="Username"
            />

            <input
                type="text"
                id="typeInput"
                class="input"
                placeholder="Type (Bug Report, Update, Idea...)"
            />

            <button class="button" onclick="enterForum()">
                Enter Forum
            </button>
        </div>
    </div>

    <div class="chat-screen" id="chatScreen">

        <div class="messages" id="messages"></div>

        <div class="chat-bottom">
            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Write a message..."
            />

            <button class="send-button" onclick="sendMessage()">
                Send
            </button>
        </div>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlc2jLqVksavDl-AjyjeGkpIreUFL-du8",
  authDomain: "modownloader-forum.firebaseapp.com",
  databaseURL: "https://modownloader-forum-default-rtdb.firebaseio.com",
  projectId: "modownloader-forum",
  storageBucket: "modownloader-forum.firebasestorage.app",
  messagingSenderId: "899216130492",
  appId: "1:899216130492:web:355d4da7be4a36ed72ebb9",
  measurementId: "G-4Q9SCHVT6K"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

let currentUser = "";
let currentType = "";

function enterForum() {
    const username = document
        .getElementById("usernameInput")
        .value
        .trim();

    const type = document
        .getElementById("typeInput")
        .value
        .trim();

    if (!username || !type) {
        alert("Please fill all fields.");
        return;
    }

    currentUser = username;
    currentType = type;

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("chatScreen").style.display = "flex";

    loadMessages();
}

function loadMessages() {

    const messagesContainer =
        document.getElementById("messages");

    onValue(ref(database, "messages"), (snapshot) => {

        messagesContainer.innerHTML = "";

        snapshot.forEach((child) => {
            createMessageElement(child.val());
        });

        scrollBottom();

    });

}

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text = input.value.trim();

    if (!text) return;

    push(ref(database, "messages"), {
        username: currentUser,
        type: currentType,
        text: text,
        time: Date.now()
    });

    input.value = "";

    scrollBottom();
}

function scrollBottom() {
    const messagesContainer = document.getElementById("messages");

    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// ENTER KEY SEND

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
